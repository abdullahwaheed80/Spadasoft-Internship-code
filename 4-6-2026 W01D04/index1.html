<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive CSS Grid Dashboard</title>
    <style>
        /* Reset and Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            padding: 20px;
        }

        /* THE GRID CONTAINER */
        .dashboard {
            display: grid;

            /* 3 Columns: 250px fixed sidebar, and 2 flexible columns split 2:1 */
            grid-template-columns: 250px 2fr 1fr;

            /* 3 Rows: Header (80px), Main Content (auto size), Footer (60px) */
            grid-template-rows: 80px auto 60px;

            /* 20px universal spacing between columns and rows */
            gap: 20px;

            max-width: 1400px;
            margin: 0 auto;
            min-height: calc(100vh - 40px);
        }

        /* Common Card Styling for Grid Items */
        .card {
            background-color: #ffffff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-weight: bold;
            border: 2px solid #e1e4e8;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: #007bff;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }

        /* POSITIONING ITEMS WITH GRID-AREA */
        /* Syntax: grid-row-start / grid-column-start / grid-row-end / grid-column-end */

        .header {
            /* Start Row 1, Col 1 -> End Row 2, Col 4 (Spans all 3 columns) */
            grid-area: 1 / 1 / 2 / 4;
            background-color: #007bff;
            color: white;
            border-color: #0069d9;
        }

        .sidebar {
            /* Start Row 2, Col 1 -> End Row 4, Col 2 (Spans down past main content to footer) */
            grid-area: 2 / 1 / 4 / 2;
            background-color: #2c3e50;
            color: #ecf0f1;
            border-color: #34495e;
        }

        .main-chart {
            /* Sits in Row 2, Column 2. Does not span. */
            grid-area: 2 / 2 / 3 / 3;
            min-height: 300px;
            background-color: #e3faf2;
            color: #0ca678;
        }

        .recent-activity {
            /* Sits in Row 2, Column 3. Does not span. */
            grid-area: 2 / 3 / 3 / 4;
            background-color: #fff9db;
            color: #f59f00;
        }

        .footer {
            /* Start Row 3, Col 2 -> End Row 4, Col 4 (Spans across the bottom, skipping sidebar) */
            grid-area: 3 / 2 / 4 / 4;
            background-color: #f8f9fa;
            color: #6c757d;
        }

        /* RESPONSIVE DESIGN (Bonus Rule) */
        /* When screen is under 900px wide, squash everything into a 1-column stack */
        @media (max-width: 900px) {
            .dashboard {
                grid-template-columns: 1fr;
                grid-template-rows: auto;
            }

            /* Reset grid areas so items just stack in their natural HTML order */
            .header,
            .sidebar,
            .main-chart,
            .recent-activity,
            .footer {
                grid-area: auto;
            }
        }
    </style>
</head>

<body>

    <div class="dashboard">
        <header class="card header">
            Header (Spans columns 1 to 3)
        </header>

        <nav class="card sidebar">
            Sidebar (Spans rows 2 to 3)
        </nav>

        <main class="card main-chart">
            Main Analytics Content (Takes up 2fr width)
        </main>

        <aside class="card recent-activity">
            Sidebar Widget (Takes up 1fr width)
        </aside>

        <footer class="card footer">
            Footer (Spans columns 2 to 3)
        </footer>
    </div>

</body>

</html>
